<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>favicon subtle test</title>
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-0.png" />
    <style>
      body {
        background: #0a0e14;
        color: #e6edf3;
        font: 16px/1.5 ui-monospace, monospace;
        padding: 2rem;
      }
      p {
        color: #8b98ab;
      }
    </style>
  </head>
  <body>
    <h1>favicon subtle test</h1>
    <p>the tab icon is the real two-frame gif icon, blinking at 700ms and 500ms.</p>
    <p id="status">starting...</p>
    <script>
      const frames = [
        { src: "/favicon-0.png", hold: 700 },
        { src: "/favicon-1.png", hold: 500 },
      ];
      const status = document.getElementById("status");
      let link = document.querySelector('link[rel="icon"]');
      let index = 0;
      let version = 0;

      function step() {
        const frame = frames[index];
        const next = document.createElement("link");
        next.rel = "icon";
        next.type = "image/png";
        next.setAttribute("sizes", "16x16");
        next.href = `${frame.src}?v=${version++}`;
        document.head.append(next);
        link.remove();
        link = next;
        status.textContent = `frame ${index + 1} shown at ${new Date().toLocaleTimeString()}`;
        index = (index + 1) % frames.length;
        setTimeout(step, frame.hold);
      }

      setTimeout(step, 500);
    </script>
  </body>
</html>
